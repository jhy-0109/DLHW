<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한영 번역 및 발음 시뮬레이터 (미국식 / 영국식)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter & Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .sound-wave-bar {
            animation: soundWave 1.2s infinite ease-in-out;
        }

        @keyframes soundWave {
            0%, 100% { height: 6px; }
            50% { height: 24px; }
        }

        .sound-wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .sound-wave-bar:nth-child(3) { animation-delay: 0.4s; }
        .sound-wave-bar:nth-child(4) { animation-delay: 0.1s; }
        .sound-wave-bar:nth-child(5) { animation-delay: 0.3s; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans relative overflow-x-hidden selection:bg-brand-500 selection:text-white">

    <!-- Background Animated Blobs -->
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none -z-10 animate-pulse"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none -z-10 animate-pulse" style="animation-duration: 4s;"></div>

    <!-- Header Section -->
    <header class="w-full max-w-5xl mx-auto px-4 py-6 flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                <i class="fa-solid me-1 fa-language text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">한영 번역 & 발음 보이스</h1>
                <p class="text-xs text-slate-400">American vs British Accent TTS</p>
            </div>
        </div>
        <div class="flex items-center gap-2 text-xs bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/50 text-slate-300">
            <span id="voice-status-dot" class="w-2 h-2 rounded-full bg-amber-400"></span>
            <span id="voice-status-text">음성 엔진 준비 중...</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-5xl mx-auto px-4 py-8 flex-1 flex flex-col justify-center">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch">
            
            <!-- Left Panel: Input Korean -->
            <div class="glass-panel rounded-2xl p-6 bg-slate-800/60 border border-slate-700/60 shadow-xl flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <label for="korean-input" class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                            <span class="inline-block w-2 h-2 rounded-full bg-blue-500"></span>
                            한국어 텍스트 입력
                        </label>
                        <button id="clear-btn" class="text-xs text-slate-400 hover:text-slate-200 transition-colors flex items-center gap-1">
                            <i class="fa-solid fa-rotate-right"></i> 지우기
                        </button>
                    </div>
                    <textarea id="korean-input" rows="6" 
                        class="w-full p-4 rounded-xl bg-slate-900/80 border border-slate-700 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition-all resize-none text-base leading-relaxed" 
                        placeholder="번역할 한국어 문장을 입력하세요... (예: 오늘 날씨가 정말 화창하고 좋네요.)"></textarea>
                </div>

                <div class="mt-4 space-y-3">
                    <div class="flex flex-wrap gap-2">
                        <span class="text-xs text-slate-400 flex items-center mr-1">예시:</span>
                        <button class="sample-tag text-xs bg-slate-700/50 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-600/40 transition-colors">안녕하세요, 반가워요!</button>
                        <button class="sample-tag text-xs bg-slate-700/50 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-600/40 transition-colors">공항으로 가는 길을 알려주세요.</button>
                        <button class="sample-tag text-xs bg-slate-700/50 hover:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-600/40 transition-colors">이 음식 추천해주실 수 있나요?</button>
                    </div>

                    <button id="translate-btn" class="w-full py-3.5 px-6 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-[0.99] text-white font-medium shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center gap-2 group">
                        <i class="fa-solid fa-wand-magic-sparkles text-sm group-hover:rotate-12 transition-transform"></i>
                        <span>영어로 번역하기</span>
                    </button>
                </div>
            </div>

            <!-- Right Panel: Output English & Audio Player -->
            <div class="glass-panel rounded-2xl p-6 bg-slate-800/60 border border-slate-700/60 shadow-xl flex flex-col justify-between relative">
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-sm font-semibold text-slate-300 flex items-center gap-2">
                            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                            영어 번역 결과
                        </label>
                        <button id="copy-btn" class="text-xs text-slate-400 hover:text-emerald-400 transition-colors flex items-center gap-1 bg-slate-700/40 px-2.5 py-1 rounded-lg border border-slate-600/30">
                            <i class="fa-regular fa-copy"></i> 복사하기
                        </button>
                    </div>

                    <!-- Output English Box -->
                    <div id="english-output-container" class="relative min-h-[150px] p-4 rounded-xl bg-slate-900/80 border border-slate-700 flex items-center justify-center">
                        <p id="english-output" class="text-slate-200 text-lg leading-relaxed font-medium w-full text-left hidden"></p>
                        <p id="empty-placeholder" class="text-slate-500 text-sm text-center">
                            <i class="fa-solid fa-arrow-left-long hidden md:inline mr-1"></i> 번역할 텍스트를 입력하고 버튼을 누르세요.
                        </p>
                        
                        <!-- Loading Indicator -->
                        <div id="loading-spinner" class="hidden flex flex-col items-center gap-2 text-blue-400">
                            <i class="fa-solid fa-circle-notch fa-spin text-2xl"></i>
                            <span class="text-xs text-slate-400">번역 중입니다...</span>
                        </div>
                    </div>
                </div>

                <!-- Audio Speech Section -->
                <div class="mt-6 pt-4 border-t border-slate-700/60">
                    <div class="flex items-center justify-between mb-3">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">발음 들어보기 (Accent Audio)</span>
                        
                        <!-- Sound Wave Visualizer Animation -->
                        <div id="sound-visualizer" class="flex items-center gap-1 h-6 opacity-0 transition-opacity">
                            <div class="sound-wave-bar w-1 bg-blue-500 rounded-full"></div>
                            <div class="sound-wave-bar w-1 bg-indigo-500 rounded-full"></div>
                            <div class="sound-wave-bar w-1 bg-purple-500 rounded-full"></div>
                            <div class="sound-wave-bar w-1 bg-emerald-500 rounded-full"></div>
                            <div class="sound-wave-bar w-1 bg-blue-400 rounded-full"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <!-- American Accent Button -->
                        <button id="play-us-btn" disabled class="audio-btn p-3 rounded-xl bg-slate-700/40 hover:bg-slate-700/80 border border-slate-600/40 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-3 group text-left">
                            <div class="w-10 h-10 rounded-lg bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-400 group-hover:scale-105 transition-transform flex-shrink-0">
                                <span class="text-lg">🇺🇸</span>
                            </div>
                            <div class="overflow-hidden">
                                <div class="text-xs text-slate-400">미국식 발음</div>
                                <div class="text-sm font-semibold text-slate-200 flex items-center gap-1">
                                    <i class="fa-solid fa-play text-xs text-blue-400 play-icon"></i> American
                                </div>
                            </div>
                        </button>

                        <!-- British Accent Button -->
                        <button id="play-uk-btn" disabled class="audio-btn p-3 rounded-xl bg-slate-700/40 hover:bg-slate-700/80 border border-slate-600/40 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-3 group text-left">
                            <div class="w-10 h-10 rounded-lg bg-purple-500/10 border border-purple-500/30 flex items-center justify-center text-purple-400 group-hover:scale-105 transition-transform flex-shrink-0">
                                <span class="text-lg">🇬🇧</span>
                            </div>
                            <div class="overflow-hidden">
                                <div class="text-xs text-slate-400">영국식 발음</div>
                                <div class="text-sm font-semibold text-slate-200 flex items-center gap-1">
                                    <i class="fa-solid fa-play text-xs text-purple-400 play-icon"></i> British
                                </div>
                            </div>
                        </button>
                    </div>

                    <!-- Voice Select Dropdown Accordion (Optional details) -->
                    <div class="mt-3 text-right">
                        <button id="toggle-voice-settings" class="text-[11px] text-slate-400 hover:text-slate-300 underline">
                            상세 음성 엔진 설정
                        </button>
                    </div>
                    
                    <div id="voice-settings-panel" class="hidden mt-2 p-3 rounded-lg bg-slate-900/60 border border-slate-800 text-xs space-y-2">
                        <div>
                            <label class="text-slate-400 block mb-1">US Voice:</label>
                            <select id="us-voice-select" class="w-full bg-slate-800 text-slate-200 p-1.5 rounded border border-slate-700 focus:outline-none"></select>
                        </div>
                        <div>
                            <label class="text-slate-400 block mb-1">UK Voice:</label>
                            <select id="uk-voice-select" class="w-full bg-slate-800 text-slate-200 p-1.5 rounded border border-slate-700 focus:outline-none"></select>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="fixed bottom-6 right-6 bg-emerald-500 text-slate-950 font-semibold px-4 py-2.5 rounded-xl shadow-xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
            <i class="fa-solid fa-circle-check"></i>
            <span id="toast-message">클립보드에 복사되었습니다.</span>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-5xl mx-auto px-4 py-4 text-center text-xs text-slate-500 border-t border-slate-800/60">
        Web Speech API & Free Translation Engine Powered Application
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const koreanInput = document.getElementById('korean-input');
            const englishOutput = document.getElementById('english-output');
            const emptyPlaceholder = document.getElementById('empty-placeholder');
            const loadingSpinner = document.getElementById('loading-spinner');
            const translateBtn = document.getElementById('translate-btn');
            const clearBtn = document.getElementById('clear-btn');
            const copyBtn = document.getElementById('copy-btn');
            
            const playUsBtn = document.getElementById('play-us-btn');
            const playUkBtn = document.getElementById('play-uk-btn');
            const soundVisualizer = document.getElementById('sound-visualizer');
            
            const voiceStatusDot = document.getElementById('voice-status-dot');
            const voiceStatusText = document.getElementById('voice-status-text');
            const toggleVoiceSettings = document.getElementById('toggle-voice-settings');
            const voiceSettingsPanel = document.getElementById('voice-settings-panel');
            const usVoiceSelect = document.getElementById('us-voice-select');
            const ukVoiceSelect = document.getElementById('uk-voice-select');
            
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const sampleTags = document.querySelectorAll('.sample-tag');

            // Speech Synthesis State
            const synth = window.speechSynthesis;
            let voices = [];
            let currentSpeakingBtn = null;

            // 1. Initialize Speech Voices
            function initVoices() {
                if (!synth) {
                    voiceStatusDot.className = 'w-2 h-2 rounded-full bg-red-500';
                    voiceStatusText.textContent = 'TTS 미지원 브라우저';
                    return;
                }

                voices = synth.getVoices();
                if (voices.length > 0) {
                    populateVoiceLists();
                }
            }

            function populateVoiceLists() {
                voices = synth.getVoices();
                usVoiceSelect.innerHTML = '';
                ukVoiceSelect.innerHTML = '';

                const usVoices = voices.filter(v => v.lang.includes('en-US') || v.lang.includes('en_US'));
                const ukVoices = voices.filter(v => v.lang.includes('en-GB') || v.lang.includes('en_gb'));
                const allEnVoices = voices.filter(v => v.lang.startsWith('en'));

                if (voices.length > 0) {
                    voiceStatusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                    voiceStatusText.textContent = '음성 엔진 준비완료';
                }

                // US Voices
                const usList = usVoices.length > 0 ? usVoices : allEnVoices;
                usList.forEach(voice => {
                    const option = document.createElement('option');
                    option.value = voice.name;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    usVoiceSelect.appendChild(option);
                });

                // UK Voices
                const ukList = ukVoices.length > 0 ? ukVoices : allEnVoices;
                ukList.forEach(voice => {
                    const option = document.createElement('option');
                    option.value = voice.name;
                    option.textContent = `${voice.name} (${voice.lang})`;
                    ukVoiceSelect.appendChild(option);
                });
            }

            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = populateVoiceLists;
            }
            initVoices();

            // 2. Translation Handler using MyMemory Free Translation API
            async function translateText(text) {
                if (!text.trim()) return;

                // UI Loading state
                emptyPlaceholder.classList.add('hidden');
                englishOutput.classList.add('hidden');
                loadingSpinner.classList.remove('hidden');
                translateBtn.disabled = true;

                try {
                    const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`);
                    const data = await response.json();

                    if (data && data.responseData) {
                        const translated = data.responseData.translatedText;
                        englishOutput.textContent = translated;
                        englishOutput.classList.remove('hidden');
                        
                        // Enable Speech Buttons
                        playUsBtn.disabled = false;
                        playUkBtn.disabled = false;
                    } else {
                        throw new Error('Translation failed');
                    }
                } catch (error) {
                    console.error('Translation Error:', error);
                    englishOutput.textContent = '번역 중 오류가 발생했습니다. 다시 시도해 주세요.';
                    englishOutput.classList.remove('hidden');
                } finally {
                    loadingSpinner.classList.add('hidden');
                    translateBtn.disabled = false;
                }
            }

            // 3. Audio Playback Handler
            function speak(text, langCode, selectElem, button) {
                if (!synth || !text) return;

                // Stop any playing speech
                synth.cancel();
                stopVisualizer();

                const utterance = new SpeechSynthesisUtterance(text);
                
                // Find selected voice or matching voice
                const selectedVoiceName = selectElem.value;
                let targetVoice = voices.find(v => v.name === selectedVoiceName);

                if (!targetVoice) {
                    targetVoice = voices.find(v => v.lang.toLowerCase().replace('_', '-').includes(langCode.toLowerCase()));
                }

                if (targetVoice) {
                    utterance.voice = targetVoice;
                }
                utterance.lang = langCode;
                utterance.rate = 0.95; // Slightly slower for clear pronunciation

                utterance.onstart = () => {
                    currentSpeakingBtn = button;
                    startVisualizer();
                    button.classList.add('ring-2', 'ring-blue-500', 'bg-slate-700');
                    const icon = button.querySelector('.play-icon');
                    if (icon) icon.className = 'fa-solid fa-volume-high text-xs text-blue-400 play-icon animate-bounce';
                };

                utterance.onend = () => {
                    resetAudioUI(button);
                };

                utterance.onerror = () => {
                    resetAudioUI(button);
                };

                synth.speak(utterance);
            }

            function startVisualizer() {
                soundVisualizer.classList.remove('opacity-0');
            }

            function stopVisualizer() {
                soundVisualizer.classList.add('opacity-0');
            }

            function resetAudioUI(button) {
                stopVisualizer();
                if (button) {
                    button.classList.remove('ring-2', 'ring-blue-500', 'bg-slate-700');
                    const icon = button.querySelector('.play-icon');
                    if (icon) icon.className = 'fa-solid fa-play text-xs text-blue-400 play-icon';
                }
            }

            // 4. Event Listeners
            translateBtn.addEventListener('click', () => {
                const text = koreanInput.value;
                if (!text.trim()) {
                    showToast('한국어 텍스트를 입력해주세요.');
                    return;
                }
                translateText(text);
            });

            // Enter Key Shortcut (Ctrl + Enter or Cmd + Enter or Enter on desktop)
            koreanInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    e.preventDefault();
                    translateBtn.click();
                }
            });

            clearBtn.addEventListener('click', () => {
                koreanInput.value = '';
                englishOutput.textContent = '';
                englishOutput.classList.add('hidden');
                emptyPlaceholder.classList.remove('hidden');
                playUsBtn.disabled = true;
                playUkBtn.disabled = true;
                synth.cancel();
                stopVisualizer();
            });

            playUsBtn.addEventListener('click', () => {
                const text = englishOutput.textContent;
                speak(text, 'en-US', usVoiceSelect, playUsBtn);
            });

            playUkBtn.addEventListener('click', () => {
                const text = englishOutput.textContent;
                speak(text, 'en-GB', ukVoiceSelect, playUkBtn);
            });

            // Copy to Clipboard
            copyBtn.addEventListener('click', () => {
                const text = englishOutput.textContent;
                if (!text) {
                    showToast('복사할 텍스트가 없습니다.');
                    return;
                }
                
                // Fallback for execCommand clipboard copy
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = text;
                document.body.appendChild(tempTextArea);
                tempTextArea.select();
                try {
                    document.execCommand('copy');
                    showToast('영어 번역문이 복사되었습니다!');
                } catch (err) {
                    showToast('복사 실패');
                }
                document.body.removeChild(tempTextArea);
            });

            // Sample Tags Click
            sampleTags.forEach(tag => {
                tag.addEventListener('click', () => {
                    koreanInput.value = tag.textContent;
                    translateText(tag.textContent);
                });
            });

            // Toggle Voice Settings
            toggleVoiceSettings.addEventListener('click', () => {
                voiceSettingsPanel.classList.toggle('hidden');
            });

            // Helper: Toast Notification
            function showToast(msg) {
                toastMessage.textContent = msg;
                toast.classList.remove('translate-y-20', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-20', 'opacity-0');
                }, 2500);
            }
        });
    </script>
</body>
</html>
