<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 학습 & 발음 변환기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 md:p-8 space-y-6 border border-slate-100">
    
    <!-- 헤더 -->
    <div class="text-center space-y-2">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-800">
        <i class="fa-solid fa-language text-indigo-600 mr-2"></i>한국어-영어 학습 변환기
      </h1>
      <p class="text-slate-500 text-sm">한국어를 입력하면 영어 번역, 발음(US/UK), 핵심 문법 설명을 제공합니다.</p>
    </div>

    <!-- 입력 영역 -->
    <div class="space-y-2">
      <label for="koInput" class="block font-semibold text-slate-700 text-sm">한국어 텍스트 입력</label>
      <div class="relative">
        <textarea id="koInput" rows="3" 
          class="w-full p-4 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none resize-none transition text-slate-800 text-base"
          placeholder="예: 나는 매일 아침 사과를 먹는 것을 즐긴다."></textarea>
      </div>
      <button id="translateBtn" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl shadow-md transition flex items-center justify-center space-x-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>번역 및 분석하기</span>
      </button>
    </div>

    <!-- 결과 영역 (기본적으로 숨김) -->
    <div id="resultBox" class="hidden space-y-6 pt-4 border-t border-slate-100">
      
      <!-- 영어 번역 결과 -->
      <div class="bg-indigo-50/60 rounded-xl p-5 border border-indigo-100 space-y-3">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 bg-indigo-100 px-2.5 py-1 rounded-md">Translated English</span>
          <button id="copyBtn" class="text-slate-400 hover:text-indigo-600 text-sm transition" title="복사하기">
            <i class="fa-regular fa-copy"></i>
          </button>
        </div>
        <p id="enText" class="text-xl font-bold text-slate-800 leading-relaxed"></p>
      </div>

      <!-- 오디오 재생 버튼 (US & UK) -->
      <div class="grid grid-cols-2 gap-4">
        <button id="speakUS" 
          class="flex items-center justify-center space-x-3 bg-slate-800 hover:bg-slate-900 text-white py-3 px-4 rounded-xl shadow transition active:scale-95">
          <i class="fa-solid fa-volume-high text-indigo-400"></i>
          <span class="font-semibold text-sm">🇺🇸 American Accent</span>
        </button>

        <button id="speakUK" 
          class="flex items-center justify-center space-x-3 bg-slate-800 hover:bg-slate-900 text-white py-3 px-4 rounded-xl shadow transition active:scale-95">
          <i class="fa-solid fa-volume-high text-rose-400"></i>
          <span class="font-semibold text-sm">🇬🇧 British Accent</span>
        </button>
      </div>

      <!-- 문법 주석/포인트 영역 -->
      <div class="bg-amber-50/70 border border-amber-200/60 rounded-xl p-5 space-y-2">
        <div class="flex items-center space-x-2 text-amber-800 font-bold text-sm">
          <i class="fa-solid fa-lightbulb text-amber-500"></i>
          <span>학습용 문법 포인트 (Grammar Notes)</span>
        </div>
        <ul id="grammarNotes" class="list-disc list-inside text-slate-700 text-sm space-y-1.5 pl-1 leading-relaxed">
          <!-- JS로 문법 노트를 동적으로 삽입 -->
        </ul>
      </div>

    </div>

  </div>

  <script>
    const translateBtn = document.getElementById('translateBtn');
    const koInput = document.getElementById('koInput');
    const resultBox = document.getElementById('resultBox');
    const enTextEl = document.getElementById('enText');
    const grammarNotesEl = document.getElementById('grammarNotes');
    const speakUSBtn = document.getElementById('speakUS');
    const speakUKBtn = document.getElementById('speakUK');
    const copyBtn = document.getElementById('copyBtn');

    let currentEnText = '';

    // 번역 및 문법 분석 처리
    translateBtn.addEventListener('click', async () => {
      const text = koInput.value.trim();
      if (!text) {
        alert('한국어 텍스트를 입력해주세요.');
        return;
      }

      // 버튼 로딩 상태
      translateBtn.disabled = true;
      translateBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>번역 중...</span>`;

      try {
        // MyMemory 무료 번역 API 활용
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`);
        const data = await response.json();
        
        currentEnText = data.responseData.translatedText;
        enTextEl.textContent = currentEnText;

        // 문법 주석 추출 및 생성
        generateGrammarNotes(currentEnText, text);

        resultBox.classList.remove('hidden');
      } catch (error) {
        alert('번역 과정에서 오류가 발생했습니다.');
        console.error(error);
      } finally {
        translateBtn.disabled = false;
        translateBtn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> <span>번역 및 분석하기</span>`;
      }
    });

    // 간단한 패턴 기반 문법 추출 함수 (학습용 주석 생성기)
    function generateGrammarNotes(en, ko) {
      grammarNotesEl.innerHTML = '';
      const notes = [];

      // 1. 동명사/부정사 목적어 패턴 검사
      if (/\b(enjoy|enjoyed|enjoys|mind|finish|stop|suggest)ing\b/i.test(en) || /enjoying/i.test(en)) {
        notes.push("<b>동명사(ing) 목적어:</b> 'enjoy', 'finish' 등의 동사는 목적으로 동명사를 취합니다.");
      }
      if (/\b(want|decide|hope|plan|need)s?\s+to\s+\w+/i.test(en)) {
        notes.push("<b>to-부정사 목적어:</b> 'want', 'decide', 'plan' 등은 목적어로 'to + 동사원형'을 사용합니다.");
      }

      // 2. 관계대명사 패턴 검사
      if (/\b(who|which|that)\b/i.test(en)) {
        notes.push("<b>관계대명사 (who/which/that):</b> 선행사(명사)를 뒤에서 수임/설명해주는 형용사절 역할을 합니다.");
      }

      // 3. 완료 시제 검사
      if (/\b(have|has|had)\s+\w+ed\b/i.test(en) || /\b(have|has|had)\s+(been|done|eaten|gone|seen)\b/i.test(en)) {
        notes.push("<b>완료 시제 (have/has + p.p.):</b> 과거에 시작되어 현재까지 영향을 미치는 동작이나 상태를 나타냅니다.");
      }

      // 4. 수동태 검사
      if (/\b(is|are|was|were|be|been)\s+\w+ed\b/i.test(en)) {
        notes.push("<b>수동태 (be + p.p.):</b> 주어가 동작을 받는 대상을 강조할 때 사용됩니다.");
      }

      // 5. 조동사 검사
      if (/\b(should|must|can|could|would|may|might)\b/i.test(en)) {
        notes.push("<b>조동사:</b> 동사 앞에 위치하여 의무, 가능성, 허가 등의 의미를 보완합니다.");
      }

      // 6. 관사 노트 (항상 기본 제공 규칙)
      if (/\b(a|an|the)\b/i.test(en)) {
        notes.push("<b>관사 (a/an/the):</b> 셀 수 있는 단수 명사 앞에는 'a/an', 특정하거나 이미 언급된 명사 앞에는 'the'가 붙습니다.");
      }

      // 7. 시제 판별 기본 규칙
      if (/\b(yesterday|last|ago)\b/i.test(en) || /\b\w+ed\b/i.test(en)) {
        notes.push("<b>과거 시제:</b> 과거의 특정 시점에 일어난 사건을 표현합니다.");
      } else {
        notes.push("<b>현재 시제/일반적 사실:</b> 반복되는 습관이나 일반적인 사실을 나타낼 때는 현재형 동사를 사용합니다.");
      }

      // 추출된 노트를 HTML에 추가
      notes.forEach(note => {
        const li = document.createElement('li');
        li.innerHTML = note;
        grammarNotesEl.appendChild(li);
      });
    }

    // Web Speech API (TTS) 보이스 재생 함수
    function speakText(text, lang) {
      if (!('speechSynthesis' in window)) {
        alert('이 브라우저는 음성 합성을 지원하지 않습니다.');
        return;
      }

      window.speechSynthesis.cancel(); // 이전 재생 중단

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang; // 'en-US' 또는 'en-GB'
      utterance.rate = 0.9;  // 학습용으로 약간 천천히 재생

      // 사용 가능한 음성목록 중 해당 언어에 가장 적합한 보이스 선택
      const voices = window.speechSynthesis.getVoices();
      const selectedVoice = voices.find(v => v.lang.replace('_', '-').includes(lang));
      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    // 버튼 이벤트 리스너
    speakUSBtn.addEventListener('click', () => {
      if (currentEnText) speakText(currentEnText, 'en-US');
    });

    speakUKBtn.addEventListener('click', () => {
      if (currentEnText) speakText(currentEnText, 'en-GB');
    });

    // 클립보드 복사 기능
    copyBtn.addEventListener('click', () => {
      if (!currentEnText) return;
      navigator.clipboard.writeText(currentEnText).then(() => {
        alert('영어 문장이 클립보드에 복사되었습니다.');
      });
    });

    // 브라우저 보이스 로딩 대기
    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
