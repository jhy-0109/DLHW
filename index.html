<!DOCTYPE html>
<html>

<head>
    <title>앱</title>

    <!-- CSS: Change how the app looks -->
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
        }

        button {
            font-size: 30px !important;
            padding: 23px !important;
            margin: 10px !important;
            background-color: lightpurple !important;
        }
    </style>
</head>

<body>

    <!-- HTML: Change what learners see -->

    <h1>Vocabulary Quiz</h1>

    <p>What does "break down" mean?</p>

    <button onclick="checkAnswer('stop')">
        Stop
    </button>

    <button onclick="checkAnswer('avoid')">
        Avoid
    </button>

    <button onclick="checkAnswer('watch')">
        Watch
    </button>

    <h3 id="feedback"></h3>


    <!-- JavaScript: Change what happens -->

    <script>

        function checkAnswer(answer) {

            if (answer === "stop") {
                document.getElementById("feedback").innerText =
                    "정답!";
            }

            else {
                document.getElementById("feedback").innerText =
                    "오답! 정답은 Stop.";
            }

        }

    </script>

</body>
</html>
